; حدود رفع الملفات — لازم تكون أكبر من أكبر فيديو مسموح بيه (100 ميجا)
; الملف ده بيشتغل لما PHP يشتغل كـ FPM / FastCGI / CGI (أغلب الاستضافات وcPanel)
; ملاحظة: PHP بيكاش الملف ده لمدة 5 دقايق (user_ini.cache_ttl) فاستنى شوية بعد التعديل
; ملاحظة 2: لو PHP شغال كـ Apache module (mod_php) الملف ده مش هيشتغل — استخدم .htaccess

upload_max_filesize = 128M
post_max_size = 130M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
